<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Exercise 3 - Contact & Calculator</title>
</head>
<body>

    <!-- 1. Header Section -->
    <div>
        <h1>My Website <span>| Welcome to Our Interactive Portal</span></h1>
    </div>

    <hr>

    <!-- 2. Content Section -->
    <div>
        <!-- Contact Form -->
        <section>
            <h2>Contact Us</h2>
            <form action="#" method="post">
                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" required placeholder="example@domain.com">
                </p>

                <p>
                    <label for="contact-date">Preferred Contact Date:</label><br>
                    <input type="date" id="contact-date" name="contact_date">
                </p>

                <p>
                    <label for="satisfaction">Satisfaction Level (1-10):</label><br>
                    <input type="range" id="satisfaction" name="satisfaction" min="1" max="10" value="5">
                </p>

                <p>
                    <input type="submit" value="Submit">
                </p>
            </form>
        </section>

        <hr>

        <!-- Inline Calculator -->
        <div>
            <h2>Inline Calculator</h2>
            <form oninput="result.value = parseFloat(num1.value || 0) + parseFloat(num2.value || 0)">
                <label for="num1">First Number:</label>
                <input type="number" id="num1" name="num1" value="0">
                
                <span> + </span>

                <label for="num2">Second Number:</label>
                <input type="number" id="num2" name="num2" value="0">
                
                <span> = </span>

                <output name="result" for="num1 num2">0</output>
            </form>
        </div>
    </div>

    <hr>

    <!-- 3. Footer Section -->
    <div>
        <p>Contact Us: info@example.com | Phone: +60 12-345 6789</p>
        <p>&copy; 2026 Interactive Web Design. All rights reserved.</p>
    </div>

</body>
</html>
